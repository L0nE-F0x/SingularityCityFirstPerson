# Integrated app: Pixi 2D under /pixi/ + First Person at /index.html
# Product entry is the 2D landing (/pixi/); FP is only linked from the 2D toolbar.

[build]
  publish = "."
  command = "echo Static integrated site - no build required"

[functions]
  directory = "pixi/netlify/functions"

# --- Prefer 2D as the site entry (production-like flow) ---
# force=true so root index.html (FP) is not served at "/".
# FP remains available at /index.html (toolbar link from 2D uses that path).
[[redirects]]
  from = "/"
  to = "/pixi/"
  status = 302
  force = true

# --- CORS / API proxies (same as production 2D) so /pixi works on this host ---
[[redirects]]
  from = "/api/hf/*"
  to = "https://huggingface.co/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/zeroeval/*"
  to = "https://api.zeroeval.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/openrouter/*"
  to = "https://openrouter.ai/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/arxiv/*"
  to = "https://export.arxiv.org/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/celestrak/*"
  to = "https://celestrak.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/orbit-sats"
  to = "/.netlify/functions/orbit-sats"
  status = 200
  force = true

[[redirects]]
  from = "/api/geo"
  to = "/.netlify/functions/geo"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/pixi/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
